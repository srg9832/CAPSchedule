<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
const URL='https://uekiecpijomfhezwllst.supabase.co';
const KEY='sb_publishable_pdeK6fu4mqyI-Ox9V0lkgg_Bw4Gr_IY';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById('app');
let state={user:null,profile:null,unit:null,units:[],activeUnitId:null,roster:[],directorySearch:'',quietSettings:null,avatars:{},tab:'chats',authMode:'signin',threads:[],users:[],messages:[],files:[],posts:[],comments:[],requests:[],adminAccounts:[],activeThread:null,board:'unit',activePost:null,view:'',demo:false,online:navigator.onLine,subscription:null,loadError:''};
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stamp(s){return s?new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}
function icon(n){const paths={chat:'<path d="M21 11a8 8 0 0 1-8 8H6l-4 3V9a8 8 0 0 1 8-8h3a8 8 0 0 1 8 8z"/>',board:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',tasks:'<rect x="4" y="3" width="16" height="19" rx="2"/><path d="m8 11 2 2 4-4M8 17h8"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a4 4 0 1 0 0-8M23 21v-2a4 4 0 0 0-3-3.87"/>',shield:'<path d="m12 22 7-4V6l-7-4-7 4v12z"/><path d="m9 12 2 2 4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1-2-4-2 1a7 7 0 0 0-2-1l-1-3h-4l-1 3a7 7 0 0 0-2 1L5 6 3 10l2 1a7 7 0 0 0 0 2l-2 1 2 4 2-1a7 7 0 0 0 2 1l1 3h4l1-3a7 7 0 0 0 2-1l2 1 2-4z"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m15 18-6-6 6-6"/>',paperclip:'<path d="m21 11.5-8.5 8.5a6 6 0 0 1-8.5-8.5L13.5 2a4 4 0 1 1 5.5 5.8l-9 9a2 2 0 0 1-3-3l8.5-8.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+(paths[n]||paths.chat)+'</svg>'}
function toast(msg){const n=document.getElementById('toast');n.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>n.innerHTML='',4700)}
function err(e){toast(e&&e.message?e.message:String(e));console.error(e)}
function short(s,n){return esc(String(s||'').slice(0,n||90))}
const menus=[['chats','Chats'],['board','Bulletin Boards'],['tasks','Requests'],['users','Directory'],['calendar','CAP Schedule'],['settings','Settings']];
function nav(){let m=menus.slice();if(state.profile&&(state.profile.unit_admin||state.profile.platform_admin))m.splice(4,0,['shield','Administration']);return m}
function setTab(n){if(n==='calendar'){window.open('https://srg9832.github.io/CAPSchedule/','_blank','noopener');return}state.tab=n;state.activeThread=null;state.activePost=null;state.view='';refreshTab()}

function header(){
 const titles={chats:'Messages',board:'Bulletin Boards',tasks:'Requests',users:'Contacts',shield:'Administration',settings:'Settings'};
 const options=state.units.filter(u=>u.id!=='DEV-ADMIN'||state.units.length===1);
 const active=state.activeUnitId||state.profile?.unit_id;
 const selector=options.length?
 '<label class="unit-switch"><span class="smallcap">Unit</span><select id="admin-unit-selector" class="field" aria-label="Current squadron">'+
 options.map(u=>'<option value="'+esc(u.id)+'" '+(u.id===active?'selected':'')+'>'+esc(u.name)+'</option>').join('')+
 '</select></label>':'';
 return '<header class="top"><div><h1>'+esc(titles[state.tab]||'CAP Messenger')+'</h1>'+
 '<p>'+esc(state.unit?.name||state.profile?.unit_id||'Squadron Communications')+'</p></div>'+
 '<div class="top-right">'+selector+'<span class="pill">PROOF OF CONCEPT</span><span class="badge">'+esc(state.profile?.kind||'')+'</span></div></header>'
}

function shell(body){let items=nav();root.innerHTML='<div class="app"><aside class="rail"><div class="brand"><div class="brand-icon">✈</div><span><strong>CAP Messenger</strong><small>SQUADRON NETWORK</small></span></div>'+items.map(x=>'<button class="nav '+(state.tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+icon(x[0]==='chats'?'chat':x[0]==='board'?'board':x[0]==='tasks'?'tasks':x[0]==='users'?'users':x[0]==='shield'?'shield':x[0]==='calendar'?'calendar':'settings')+'<span>'+x[1]+'</span></button>').join('')+'<div class="rail-footer"><div class="who">'+esc(formatPerson(state.profile))+'</div><small>'+esc(state.unit?.name||state.profile.unit_id)+' • '+esc(state.profile.kind)+'</small><button data-act="logout">Sign out →</button></div></aside><main class="main">'+header()+'<section class="content">'+body+'</section></main><nav class="mobile-nav">'+items.filter(x=>x[0]!=='calendar'&&x[0]!=='shield').map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'on':'')+'">'+icon(x[0]==='chats'?'chat':x[0]==='board'?'board':x[0]==='tasks'?'tasks':x[0]==='users'?'users':'settings')+'<span>'+x[1]+'</span></button>').join('')+'</nav></div>'}
function renderAuth(){root.innerHTML='<div class="auth-wrap"><div class="auth-intro"><div class="brand"><div class="brand-icon">✈</div><span><strong>CAP Messenger</strong><small>MEMBER COMMUNICATIONS</small></span></div><h1>Better communication.<br>Stronger squadrons.</h1><p>A focused home for squadron messages, parent coordination, bulletin boards and follow-up requests.</p><p class="hint" style="color:#92b4d1">Prototype only • No official CAP use authorized</p></div><div class="auth-panel"><div class="card auth-card"><h2>'+(state.authMode==='signup'?'Create an account':'Welcome back')+'</h2><p class="subtitle">Use the email address recorded in CAPWATCH. Accounts require verification and unit administrator approval.</p><form id="auth-form"><div class="label">Email address</div><input class="field" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><div class="label">Password</div><input class="field" name="password" type="password" minlength="8" autocomplete="'+(state.authMode==='signup'?'new-password':'current-password')+'" required placeholder="At least 8 characters"><button class="btn" type="submit">'+(state.authMode==='signup'?'Create account':'Sign in')+'</button></form><div style="text-align:center;margin:18px 0"><button class="btn light sm" data-act="switch-auth">'+(state.authMode==='signup'?'Already have an account? Sign in':'New member? Create account')+'</button></div><p class="hint">Parent eligibility comes only from the parent email in the CAPWATCH extract.</p><div class="info" style="margin-top:17px">The database is connected, but accounts cannot use member communications until a CAPWATCH import and unit approval are completed.</div></div></div></div>'}
function renderGate(message){root.innerHTML='<div class="center-screen"><div class="card pad" style="max-width:475px;margin:20px"><div class="box-icon">🔐</div><h2>Account verification</h2><p class="subtitle">'+esc(message)+'</p><p class="hint">First confirm your email, then ensure your CAPWATCH record includes that address. Your unit administrator must approve your registration before you can message anyone.</p><div class="row"><button class="btn" data-act="retry">Check again</button><button class="btn light" data-act="logout">Sign out</button></div></div></div>'}
function render(){if(!state.user){renderAuth();return}if(!state.profile||!state.profile.approved||state.profile.disabled){renderGate(state.loadError||(!state.profile?'Your member or parent account is not registered yet.':'Your account is awaiting approval or has been deactivated.'));return}
if(state.tab==='chats')shell(chatView());else if(state.tab==='board')shell(boardView());else if(state.tab==='tasks')shell(requestView());else if(state.tab==='users')shell(directoryView());else if(state.tab==='shield')shell(adminView());else shell(settingsView());
if(state.tab==='chats'&&state.activeThread) {let m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}}

function personOf(id){return state.users.find(u=>u.user_id===id)||(state.profile?.user_id===id?state.profile:null)}
function formatPerson(p){if(!p)return 'Member';if(p.kind==='parent')return p.display_name||'Parent / Guardian';
const first=(p.first_name||'').trim(),last=(p.last_name||'').trim(),grade=(p.grade||'').trim();
return first&&last?[grade,last+', '+first].filter(Boolean).join(' '):p.display_name||'Member'}
function nameOf(id){return formatPerson(personOf(id))}
function avatar(id,sz='regular'){const p=personOf(id),name=formatPerson(p),initials=(p?.first_name&&p?.last_name?
 p.first_name.slice(0,1)+p.last_name.slice(0,1):name.replace(/[^a-zA-Z0-9 ]/g,' ').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')).toUpperCase().slice(0,2)||'??';
 const url=state.avatars[id],styles=sz==='small'?'height:32px;width:32px;min-width:32px;font-size:11px':'height:42px;width:42px;min-width:42px;font-size:14px';
 return '<span class="profile-avatar" style="'+styles+'">'+(url?'<img loading="lazy" src="'+esc(url)+'" alt="">':esc(initials))+'</span>'}
async function loadAvatars(){const rows=state.users.filter(u=>u.avatar_path);await Promise.all(rows.map(async u=>{
 try{const r=await db.storage.from('msg-avatars').createSignedUrl(u.avatar_path,3600);if(!r.error)state.avatars[u.user_id]=r.data.signedUrl}
 catch(e){console.warn('Avatar unavailable')}}))}
function canRemoveMessage(m){const t=state.threads.find(t=>t.id===m.thread_id);
return m.sender_id===state.user.id||Boolean(state.profile.platform_admin||(state.profile.unit_admin&&t?.unit_id===state.profile.unit_id))}

async function init(){const {data}=await db.auth.getUser();state.user=data.user;if(!state.user){render();return}const {data:p,error:e}=await db.from('msg_accounts').select('user_id,display_name,first_name,last_name,grade,avatar_path,kind,unit_id,approved,disabled,unit_admin,platform_admin').eq('user_id',state.user.id).maybeSingle();if(e){state.loadError=e.message;state.profile=null;render();return}
state.profile=p;if(!p){const r=await db.rpc('msg_register_account');state.loadError=r.error?r.error.message:r.data;render();return}
if(!p.approved||p.disabled){state.loadError=p.disabled?'This account has been deactivated by an administrator.':'Your identity is awaiting a unit administrator verification.';render();return}
await loadBase();await refreshTab();}

async function loadBase(){
 const [units,chosen,profiles]=await Promise.all([
   db.rpc('msg_allowed_units'),
   db.rpc('msg_selected_unit'),
   db.from('msg_accounts').select('user_id,display_name,first_name,last_name,grade,avatar_path,kind,unit_id,approved,disabled,unit_admin')
 ]);
 if(units.error)throw units.error;
 if(chosen.error)throw chosen.error;
 state.units=units.data||[];
 state.users=profiles.data||[];
 const real=state.units.filter(u=>u.id!=='DEV-ADMIN');
 const resolved=state.units.some(u=>u.id===chosen.data)?chosen.data:
   state.units.some(u=>u.id===state.activeUnitId)?state.activeUnitId:
   state.profile.unit_id;
 state.activeUnitId=(resolved==='DEV-ADMIN'&&real.length)?real[0].id:resolved;
 if(!state.units.some(u=>u.id===state.activeUnitId))
   state.activeUnitId=state.units[0]?.id||state.profile.unit_id;
 state.unit=state.units.find(u=>u.id===state.activeUnitId)||{id:state.activeUnitId,name:state.activeUnitId};
 const quiet=await db.from('msg_unit_settings').select('cadet_quiet_start,cadet_quiet_end')
  .eq('unit_id',state.activeUnitId).maybeSingle();
 state.quietSettings=quiet.data||{cadet_quiet_start:21,cadet_quiet_end:8};
 if(profiles.error)console.warn(profiles.error);
 await loadAvatars();
}
async function refreshTab(){
 if(!state.profile||!state.profile.approved||state.profile.disabled){render();return}
 try{
  if(state.tab==='chats'){
    const r=await db.from('msg_threads').select('id,kind,title,unit_id,created_at')
      .eq('unit_id',state.activeUnitId).order('kind');
    if(r.error)throw r.error;state.threads=r.data||[];
  }
  if(state.tab==='board'){
    const r=await db.from('msg_posts').select('*')
      .or('unit_id.eq.'+state.activeUnitId+',unit_id.is.null')
      .order('created_at',{ascending:false}).limit(200);
    if(r.error)throw r.error;state.posts=r.data||[];
  }
  if(state.tab==='tasks'){
    const r=await db.from('msg_requests').select('*')
      .eq('unit_id',state.activeUnitId).order('created_at',{ascending:true}).limit(250);
    if(r.error)throw r.error;state.requests=r.data||[];
  }
  if(state.tab==='shield'){
    const r=await db.rpc('msg_admin_accounts');
    if(r.error)throw r.error;state.adminAccounts=r.data||[];
  }
  if(state.tab==='users'){
    const r=await db.rpc('msg_roster_contacts',{p_unit:state.activeUnitId});
    if(r.error)throw r.error;state.roster=r.data||[];
  }
  render();
 }catch(e){err(e);render()}
}

async function readThread(id){state.activeThread=id;state.messages=[];state.files=[];state.tab='chats';if(state.subscription)await db.removeChannel(state.subscription);state.subscription=db.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'msg_messages',filter:'thread_id=eq.'+id},()=>loadMessages()).subscribe();await loadMessages()}
async function loadMessages(){if(!state.activeThread)return;const r=await db.from('msg_messages').select('id,thread_id,sender_id,body,created_at,edited_at,deleted_at').eq('thread_id',state.activeThread).order('created_at',{ascending:false}).limit(100);if(r.error){err(r.error);return}state.messages=(r.data||[]).reverse();let ids=state.messages.map(m=>m.id);state.files=[];if(ids.length){const f=await db.from('msg_files').select('message_id,filename,storage_path,size_bytes').in('message_id',ids);if(!f.error)state.files=f.data||[]}render()}
async function sendMessage(body,file){const id=state.activeThread;if(!id)return;let payload={thread_id:id,sender_id:state.user.id,body:body.trim()||(file?'📎 '+file.name:'')};if(!payload.body)return;
if(file&&file.size>20971520)throw Error('File must be 20 MB or smaller');if(file&&!navigator.onLine)throw Error('Attachments require a connection. Your message has not been sent.');if(!navigator.onLine){const key='capmsg-outbox-'+state.user.id;const pending=JSON.parse(localStorage.getItem(key)||'[]');pending.push({...payload,id:crypto.randomUUID(),queued_at:Date.now()});localStorage.setItem(key,JSON.stringify(pending));toast('Offline — message saved to your outbox');return}
const r=await db.from('msg_messages').insert(payload).select('id').single();if(r.error)throw r.error;if(file){let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,100);const path=id+'/'+state.user.id+'/'+crypto.randomUUID()+'-'+safe;const f=await db.storage.from('msg-attachments').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(f.error)throw f.error;const meta=await db.from('msg_files').insert({message_id:r.data.id,uploader_id:state.user.id,storage_path:path,filename:file.name,mime:file.type,size_bytes:file.size});if(meta.error)throw meta.error}await loadMessages()}
async function flushOutbox(){if(!state.user||!navigator.onLine)return;const k='capmsg-outbox-'+state.user.id;const q=JSON.parse(localStorage.getItem(k)||'[]');if(!q.length)return;let remaining=[];for(let i=0;i<q.length;i++){try{let m=q[i];if(Date.now()-m.queued_at>86400000)continue;let r=await db.from('msg_messages').insert({id:m.id||crypto.randomUUID(),thread_id:m.thread_id,sender_id:state.user.id,body:m.body});if(r.error&&r.error.code!=='23505')throw r.error}catch(e){remaining=q.slice(i);break}}localStorage.setItem(k,JSON.stringify(remaining));if(!remaining.length)toast('Queued messages sent');if(state.activeThread)await loadMessages()}

function normalizedKey(k){return String(k||'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[^a-z0-9]/g,'')}
function parseDelimited(text,filename){
 const first=text.split(/\r?\n/).find(line=>line.trim())||'';
 const scores=[',','\t','|',';'].map(d=>({d,n:first.split(d).length-1})).sort((a,b)=>b.n-a.n);
 const sep=scores[0].d;
 if(scores[0].n===0)throw Error(filename+': Could not detect a delimited header line.');
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}
  else if(c===sep&&!quoted){row.push(cell);cell=''}
  else if((c==='\n'||c==='\r')&&!quoted){
   if(c==='\r'&&text[i+1]==='\n')i++;
   row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';
  }else cell+=c;
 }
 row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
 if(quoted)throw Error(filename+': Unclosed quoted value');
 const header=(rows.shift()||[]).map(normalizedKey);
 if(header.length!==new Set(header).size)throw Error(filename+': Duplicate column headings');
 return {filename,header,rows:rows.map(arr=>Object.fromEntries(header.map((h,i)=>[h,String(arr[i]||'').trim()])))};
}
function getField(row,aliases){for(const name of aliases){const v=row[normalizedKey(name)];if(v!==undefined&&String(v).trim())return String(v).trim()}return ''}
function validEmail(v){return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(v||'').trim())}
function memberKind(v){
 const kind=String(v||'').trim().toUpperCase().replace(/[\s_-]+/g,'');
 if(kind==='CADET'||kind==='CDT'||kind==='C')return 'cadet';
 if(kind==='SENIOR'||kind==='SENIORMEMBER'||kind==='SM'||kind==='S')return 'senior';
 return '';
}
function optedOut(v){return ['TRUE','YES','Y','1','T'].includes(String(v||'').trim().toUpperCase())}
function contactPriority(v){
 const p=String(v||'').trim().toUpperCase();
 return p==='PRIMARY'?0:p==='SECONDARY'?1:p==='EMERGENCY'?2:3;
}
function decodeCapwatch(buffer){
 const bytes=new Uint8Array(buffer);
 if(bytes[0]===255&&bytes[1]===254)return new TextDecoder('utf-16le').decode(buffer);
 if(bytes[0]===254&&bytes[1]===255)return new TextDecoder('utf-16be').decode(buffer);
 try{return new TextDecoder('utf-8',{fatal:true}).decode(buffer)}
 catch(e){return new TextDecoder('windows-1252').decode(buffer)}
}
async function prepareCapwatch(files){
 const chosen=Array.from(files);
 if(!chosen.length)throw Error('Select Member.txt and MbrContact.txt together');
 if(chosen.length>50)throw Error('Select no more than 50 files');
 const recognized=[],ignored=[],issues=[],warnings=[];
 let memberFile=null,contactFile=null;
 for(const file of chosen){
  const base=file.name.toLowerCase().replace(/^.*[/\\]/,'');
  const isMember=/^member\.(txt|csv)$/.test(base);
  const isContact=/^mbrcontacts?\.(txt|csv)$/.test(base);
  if(!isMember&&!isContact){ignored.push(file.name+' — not needed');continue}
  if(file.size>30*1024*1024)throw Error(file.name+': 30 MB maximum per file');
  const parsed=parseDelimited(decodeCapwatch(await file.arrayBuffer()),file.name);
  if(isMember){
   if(memberFile)throw Error('Select only one Member.txt file');
   const required=['capid','namelast','namefirst','rank','type','orgid','wing','unit'];
   const missing=required.filter(h=>!parsed.header.includes(h));
   if(missing.length)throw Error(file.name+': missing CAPWATCH Member headings: '+missing.join(', '));
   memberFile=parsed;
   recognized.push(file.name+' — member roster ('+parsed.rows.length+' rows)');
  }else{
   if(contactFile)throw Error('Select only one MbrContact.txt / MbrContacts.txt file');
   const required=['capid','type','priority','contact'];
   const missing=required.filter(h=>!parsed.header.includes(h));
   if(missing.length)throw Error(file.name+': missing CAPWATCH contact headings: '+missing.join(', '));
   contactFile=parsed;
   recognized.push(file.name+' — contact records ('+parsed.rows.length+' rows)');
  }
 }
 if(!memberFile||!contactFile){
  throw Error('Both Member.txt and MbrContact.txt (also accepted: MbrContacts.txt) are required. You can select them together; other extracts are ignored.');
 }
 const members=new Map();
 for(const r of memberFile.rows){
  const capid=getField(r,['CAPID']);
  if(!capid)continue;
  if(members.has(capid)){issues.push('Duplicate CAPID in Member.txt: '+capid);continue}
  const wing=getField(r,['Wing']).toUpperCase(),unitText=getField(r,['Unit']);
  const orgid=getField(r,['ORGID']);
  const unitId=orgid||(wing&&unitText?wing+'-'+unitText:'');
  const first=getField(r,['NameFirst']),last=getField(r,['NameLast']);
  const grade=getField(r,['Rank']),kind=memberKind(getField(r,['Type']));
  const status=getField(r,['MbrStatus']).toUpperCase().replace(/[\s_-]+/g,'');
  const active=!['INACTIVE','EXPIRED','TERMINATED','SUSPENDED','DECEASED'].includes(status);
  const unitName=wing&&unitText?(wing+'-'+unitText):orgid;
  members.set(capid,{
   capid,first_name:first,last_name:last,grade,kind,
   unit:unitId,unit_name:unitName,
   email:'',parent_email:'',active
  });
  if(!/^\d{1,10}$/.test(capid))issues.push('Member CAPID '+capid+' is invalid');
  if(!first||!last)issues.push('CAPID '+capid+': missing NameFirst/NameLast');
  if(!kind)issues.push('CAPID '+capid+': unrecognized membership Type '+getField(r,['Type']));
  if(!unitId)issues.push('CAPID '+capid+': missing ORGID and Wing/Unit');
  if(!grade)warnings.push('CAPID '+capid+': no Rank in Member.txt; name will display without grade');
 }
 if(!members.size)throw Error('Member.txt contains no member records');
 const contacts=new Map();let unmatchedContactCount=0,excludedDoNotContact=0;
 for(const row of contactFile.rows){
  const id=getField(row,['CAPID']);
  const member=members.get(id);
  if(!member){unmatchedContactCount++;continue}
  const type=getField(row,['Type']).toUpperCase().replace(/\s+/g,' ').trim();
  if(type!=='EMAIL'&&type!=='CADET PARENT EMAIL')continue;
  const email=getField(row,['Contact']).toLowerCase();
  if(!validEmail(email))continue;
  if(optedOut(getField(row,['DoNotContact']))){excludedDoNotContact++;continue}
  if(!contacts.has(id))contacts.set(id,{member:[],parent:[]});
  const item={email,priority:contactPriority(getField(row,['Priority']))};
  (type==='EMAIL'?contacts.get(id).member:contacts.get(id).parent).push(item);
 }
 let missingEmail=0,cadetsWithParent=0;
 for(const [id,m] of members){
  const c=contacts.get(id)||{member:[],parent:[]};
  c.member.sort((a,b)=>a.priority-b.priority);
  c.parent.sort((a,b)=>a.priority-b.priority);
  // The member's PRIMARY email wins; SECONDARY is a fallback. Never use parent email as the member login.
  const own=c.member.find(x=>x.priority===0)||c.member.find(x=>x.priority===1)||c.member[0];
  if(own)m.email=own.email;else missingEmail++;
  // Parent emails are independent of the member's email. Preserve distinct verified addresses,
  // potentially two guardians, in their CAPWATCH priority order.
  if(m.kind==='cadet'){
   const seen=new Set();
   for(const x of c.parent){
    if(!seen.has(x.email)){seen.add(x.email);m.parent_email+=(m.parent_email?';':'')+x.email}
   }
   if(seen.size)cadetsWithParent++;
  }
 }
 if(missingEmail)warnings.push(missingEmail+' member(s) have no usable EMAIL contact. They will appear on the roster but cannot register until their email is updated in eServices.');
 if(excludedDoNotContact)warnings.push(excludedDoNotContact+' email contact record(s) marked DoNotContact were not selected for login or guardian access.');
 if(unmatchedContactCount)warnings.push(unmatchedContactCount+' contact row(s) did not match a Member.txt CAPID and were ignored.');
 if(!Array.from(members.values()).some(m=>m.email))
  issues.push('No member EMAIL contacts were matched. Verify the CAPWATCH MbrContact.txt Type/Priority columns before importing.');
 const rows=[...members.values()];
 if(rows.length>10000)issues.push('Roster exceeds 10,000 members');
 const stats={members:rows.length,memberEmails:rows.length-missingEmail,missingEmail,cadetsWithParent,
  contacts:contactFile.rows.length,units:new Set(rows.map(r=>r.unit)).size,
  inactive:rows.filter(r=>!r.active).length};
 return {rows,issues,warnings,recognized,ignored,stats,
   files:chosen.map(f=>f.name)};
}

if(f.id==='chat-form'){let ids=Array.from(f.querySelectorAll('input[name=person]:checked')).map(x=>x.value);const r=await db.rpc('msg_start_thread',{p_users:ids,p_title:f.elements.namedItem('title').value});if(r.error)throw r.error;closeModal();await refreshTab();await readThread(r.data);toast('Conversation created')}
if(f.id==='post-form'){let r=await db.from('msg_posts').insert({audience:state.board,unit_id:state.board==='wing'?null:state.activeUnitId,author_id:state.user.id,title:f.elements.namedItem('title').value.trim(),body:f.elements.namedItem('body').value.trim()});if(r.error)throw r.error;closeModal();toast('Post published');await refreshTab()}
if(f.id==='comment-form'){let r=await db.from('msg_comments').insert({post_id:state.activePost,author_id:state.user.id,body:f.elements.namedItem('body').value.trim()});if(r.error)throw r.error;let id=state.activePost;closeModal();await showComments(id)}
if(f.id==='request-form'){let r=await db.from('msg_requests').insert({user_id:state.user.id,unit_id:state.profile.unit_id,kind:f.elements.namedItem('kind').value,note:f.elements.namedItem('note').value.trim()});if(r.error)throw r.error;closeModal();toast('Request added to queue');await refreshTab()}
if(f.id==='quiet-form'){let start=f.elements.namedItem('start').value;let end=f.elements.namedItem('end').value;if(start!==''&&end==='')throw Error('Choose an end time');let hours=Number(f.elements.namedItem('hours').value);let r=await db.from('msg_quiet').upsert({user_id:state.user.id,extra_start:start===''?null:Number(start),extra_end:start===''?null:Number(end),extra_until:start===''?null:new Date(Date.now()+hours*3600000).toISOString()});if(r.error)throw r.error;toast('Quiet-hour preference saved')}
if(f.id==='import-form'){const files=f.elements.namedItem('files').files;const result=await prepareCapwatch(files);capwatchReview(result,f.elements.namedItem('full').checked)}
}catch(e){err(e)}finally{if(b)b.disabled=false}});
document.addEventListener('change',async function(ev){let s=ev.target;if(s.id==='admin-unit-selector'){
 const old=state.activeUnitId;
 try{
  const r=await db.rpc('msg_switch_unit',{p_unit:s.value});
  if(r.error)throw r.error;
  state.activeThread=null;state.messages=[];state.files=[];state.roster=[];
  if(state.subscription){await db.removeChannel(state.subscription);state.subscription=null}
  await loadBase();await refreshTab();toast('Viewing '+(state.unit?.name||s.value));
 }catch(e){s.value=old;err(e)}
 return;
}
if(s.dataset.unitGrant){
 const target=state.accessTarget,unit=s.dataset.unitGrant,enabled=s.checked;
 s.disabled=true;
 try{
  const r=await db.rpc('msg_set_unit_grant',{p_user:target,p_unit:unit,p_enabled:enabled});
  if(r.error)throw r.error;
  toast((enabled?'Access granted for ':'Access removed from ')+(state.units.find(u=>u.id===unit)?.name||unit));
 }catch(e){s.checked=!enabled;err(e)}
 finally{s.disabled=false}
 return;
}if(s.dataset.request){try{let status=s.value;let r=await db.from('msg_requests').update({status,updated_at:new Date().toISOString(),completed_at:status==='completed'?new Date().toISOString():null}).eq('id',s.dataset.request);if(r.error)throw r.error;toast('Request updated');await refreshTab()}catch(e){err(e)}}if(s.id==='file-input'&&s.files.length){let c=document.querySelector('#send-form textarea');if(c&&!c.value.trim())c.value='📎 '+s.files[0].name}});
window.addEventListener('online',()=>{state.online=true;flushOutbox()});window.addEventListener('offline',()=>{state.online=false;toast('Offline mode — messages will be queued')});
db.auth.onAuthStateChange(function(event){if(event==='SIGNED_OUT'){state.user=null;state.profile=null;render()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);try{await init();await flushOutbox()}catch(e){console.error(e);root.innerHTML='<div class="center-screen"><div class="card pad"><h2>Unable to open the application</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Retry</button></div></div>'}
</script>
</body></html>
